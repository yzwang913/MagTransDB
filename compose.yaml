name: magtransdb

services:
  server:
    image: magtransdb-server:${MAGTRANSDB_VERSION:-dev}
    build:
      context: ./server
      labels:
        org.opencontainers.image.revision: "${MAGTRANSDB_REVISION:-dev}"
        org.opencontainers.image.source: https://github.com/yzwang913/MagTransDB
    env_file:
      - .env.production
    volumes:
      - ${DATA_ROOT_HOST:?Set DATA_ROOT_HOST in .env.production}:/data:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).close()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
